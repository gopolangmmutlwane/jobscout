sources:
  graduates24:
    enabled: true
    method: scrape
    base_url: https://www.graduates24.com
    max_pages: 2
    pages:
      - /graduate_programmes
      - /internshipprogrammes
      - /entry_level_jobs
      - /governmentjobs
    note: "robots.txt disallows /api and /dashboard. Scrape HTML listing pages only."

  scholarly_africa:
    enabled: false
    method: manual
    base_url: https://scholarlyafrica.com
    note: "Site serves a bot-check page to scripts and its feed. Not collected automatically. Paste ads into chat manually."

  careerjunction:
    enabled: false
    method: scrape
    base_url: https://www.careerjunction.co.za
    note: "robots.txt allows listings. Read the site terms before enabling."

  adzuna:
    enabled: true
    method: api
    country: za
    max_days_old: 14
    results_per_query: 50
    call_limit: 25
    note: "Free pilot: 25 test calls total, then paused automatically. GBP 8/month for more."
    queries:
      - data analyst
      - graduate programme
      - statistician

  email_alerts:
    enabled: false
    method: email
    note: "Job alerts from other sites, sent to a dedicated Gmail inbox"
    alert_sources:
      - pnet
      - careers24
      - linkedin
      - indeed
      - careerjunction

  company_pages:
    enabled: false
    pages: []